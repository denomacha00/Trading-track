<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Trading-track">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182231"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#2b3a4d" stroke-width="1"/>
  <!-- Candlestick 1 (green, up) -->
  <line x1="8" y1="10" x2="8" y2="24" stroke="#16c784" stroke-width="1.4"/>
  <rect x="6" y="14" width="4" height="8" rx="1" fill="#16c784"/>
  <!-- Candlestick 2 (red, down) -->
  <line x1="16" y1="7" x2="16" y2="22" stroke="#ea3943" stroke-width="1.4"/>
  <rect x="14" y="10" width="4" height="8" rx="1" fill="#ea3943"/>
  <!-- Candlestick 3 (green, up / breakout) -->
  <line x1="24" y1="5" x2="24" y2="19" stroke="#16c784" stroke-width="1.4"/>
  <rect x="22" y="8" width="4" height="8" rx="1" fill="#16c784"/>
</svg>
